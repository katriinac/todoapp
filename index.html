<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="content">
        <h1>To do: </h1>

        <input type="text" name="inputTask" id="inputTask" placeholder="Write your task here (min. 3 letters, max.100)">
        <button id="addButton">Add</button>
        <p id="charcount">0 / 100</p>

        <ul id="taskList">

        </ul>

        <p id="tasksDone">Tasks done <span id="taskDone">0/0</span></p>
        <button id="save">Save</button>
        <button id="showAll">All</button>
        <button id="active">Active</button>
        <button id="completed">Completed</button>
    </div>
</body>
</html>
