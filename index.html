<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <h1>Tasks: </h1>

    <input type="text" name="inputTask" id="inputTask" placeholder="Write your task here (min. 3 letters)" size="40">
    <input type="text" name="inputCategory" id="inputCategory" placeholder="Category name (optional)">
    <button id="addButton">Add</button>

    <ul id="taskList">

    </ul>

    <p>Tasks done <span id="taskDone">0</span></p>
    <p>Categories:</p>

    <select id="categorySelect">
        <option value="defaultCategory">Select category</option>
    </select>

    <button id="showAll">All</button>
    <button id="active">Active</button>
    <button id="completed">Completed</button>
</body>
</html>
